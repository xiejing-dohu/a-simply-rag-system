[project]
name = "smart-rag-backend"
version = "0.1.0"
description = "FastAPI backend with MySQL knowledge metadata and Milvus vectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2,<1",
    "cryptography>=43,<47",
    "fastapi==0.115.0",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pydantic-settings>=2.6,<3",
    "pymilvus==2.4.15",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.12",
    "setuptools==80.9.0",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]==0.30.0",
    "xlrd>=2,<3",
]

[tool.uv]
package = false
